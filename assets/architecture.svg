<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">FlowCommand architecture</title>
  <desc id="desc">Wispr Flow inserts dictated text into FlowCommand. An AI provider returns a structured action. FlowCommand validates it locally and executes an approved Windows action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#121a43"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#91a6f4"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="268" rx="15" fill="url(#bg)" stroke="#29366f" stroke-width="1.5"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(38 48)">
      <rect width="246" height="154" rx="12" fill="#101a40" stroke="#485da5"/>
      <text x="22" y="35" fill="#91a6f4" font-size="12" letter-spacing="1.1">01 / INPUT</text>
      <text x="22" y="75" fill="#f1f4ff" font-size="24" font-weight="600">Wispr Flow</text>
      <text x="22" y="105" fill="#a9b8e8" font-size="15">Speech → text</text>
      <text x="22" y="129" fill="#8194d0" font-size="12">No audio capture in FlowCommand</text>
    </g>
    <path d="M292 125h30m-7-7 7 7-7 7" fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(330 48)">
      <rect width="246" height="154" rx="12" fill="#101a40" stroke="#485da5"/>
      <text x="22" y="35" fill="#91a6f4" font-size="12" letter-spacing="1.1">02 / INTERPRET</text>
      <text x="22" y="75" fill="#f1f4ff" font-size="24" font-weight="600">AI provider</text>
      <text x="22" y="105" fill="#a9b8e8" font-size="15">Gemini or Claude</text>
      <text x="22" y="129" fill="#8194d0" font-size="12">Returns one structured action</text>
    </g>
    <path d="M584 125h30m-7-7 7 7-7 7" fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(622 48)">
      <rect width="246" height="154" rx="12" fill="#101a40" stroke="#485da5"/>
      <text x="22" y="35" fill="#91a6f4" font-size="12" letter-spacing="1.1">03 / PROTECT</text>
      <text x="22" y="75" fill="#f1f4ff" font-size="24" font-weight="600">Local checks</text>
      <text x="22" y="105" fill="#a9b8e8" font-size="15">Allowlist + validation</text>
      <text x="22" y="129" fill="#8194d0" font-size="12">Risk policy + confirmation</text>
    </g>
    <path d="M876 125h30m-7-7 7 7-7 7" fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(914 48)">
      <rect width="246" height="154" rx="12" fill="#101a40" stroke="#485da5"/>
      <text x="22" y="35" fill="#91a6f4" font-size="12" letter-spacing="1.1">04 / EXECUTE</text>
      <text x="22" y="75" fill="#f1f4ff" font-size="24" font-weight="600">Windows</text>
      <text x="22" y="105" fill="#a9b8e8" font-size="15">Approved actions</text>
      <text x="22" y="129" fill="#8194d0" font-size="12">Local Windows APIs</text>
    </g>
    <text x="600" y="238" fill="#8fa2dc" font-size="13" text-anchor="middle">The model chooses the intent. FlowCommand decides what is allowed and how it runs.</text>
  </g>
</svg>
