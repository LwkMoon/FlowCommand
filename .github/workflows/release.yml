name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/FlowCommand.Tests/FlowCommand.Tests.csproj -c Release

      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version "${{ github.ref_name }}"

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem artifacts -File | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @files --draft --generate-notes --title "FlowCommand ${{ github.ref_name }}"
