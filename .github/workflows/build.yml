name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FlowCommand.slnx

      - name: Build
        run: dotnet build FlowCommand.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/FlowCommand.Tests/FlowCommand.Tests.csproj -c Release --no-build --verbosity normal
